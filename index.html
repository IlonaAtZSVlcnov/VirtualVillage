<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Village</title><style>body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(#a6d8ff,#c9ffd1)}.header{display:flex;justify-content:space-between;padding:20px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;padding:20px}.card,.project,.stat{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.card{text-align:center;cursor:pointer}.hidden{display:none}button{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;background:#2563eb;color:#fff}input,textarea,select{width:100%;padding:8px;margin:6px 0}#town{padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}</style></head><body><div id="village"><div class="header"><h1 id="title">Virtual Village</h1><div><button onclick="langSet('en')">🇬🇧</button><button onclick="langSet('de')">🇩🇪</button></div></div><div class="grid"><div class='card'>🏫 School</div><div class='card'>📚 Library</div><div class='card'>🔬 Laboratory</div><div class='card' onclick='openTown()'>🏛️ <span id='th'>Town Hall</span></div><div class='card'>🌳 Park</div><div class='card'>🛍️ Marketplace</div></div></div><div id='town' class='hidden'><button onclick='closeTown()'>← Back</button><h2 id='org'>Project Organizer</h2><div class='stats'><div class='stat'>€<span id='c'>0</span><br>Costs</div><div class='stat'>€<span id='r'>0</span><br>Revenue</div><div class='stat'>€<span id='p'>0</span><br>Profit</div></div><input id='name' placeholder='Project'><textarea id='desc' placeholder='Description'></textarea><input id='cost' type='number' placeholder='Costs'><input id='rev' type='number' placeholder='Revenue'><select id='status'><option>Planned</option><option>In Progress</option><option>Completed</option></select><button onclick='saveP()'>Save Project</button><div id='list'></div></div><script>let lang='en',edit=null;const tr={en:{title:'Virtual Village',th:'Town Hall',org:'Project Organizer'},de:{title:'Virtuelles Dorf',th:'Rathaus',org:'Projektplaner'}};let items=JSON.parse(localStorage.getItem('vv-projects')||'[]');function langSet(l){lang=l;title.innerText=tr[l].title;th.innerText=tr[l].th;org.innerText=tr[l].org}function openTown(){village.classList.add('hidden');town.classList.remove('hidden');render()}function closeTown(){town.classList.add('hidden');village.classList.remove('hidden')}function saveP(){const o={id:edit||Date.now(),name:name.value,desc:desc.value,cost:+cost.value||0,rev:+rev.value||0,status:status.value};if(edit){items=items.map(x=>x.id===edit?o:x);edit=null}else items.push(o);localStorage.setItem('vv-projects',JSON.stringify(items));name.value='';desc.value='';cost.value='';rev.value='';render()}function del(id){items=items.filter(x=>x.id!==id);localStorage.setItem('vv-projects',JSON.stringify(items));render()}function editP(id){const x=items.find(a=>a.id===id);edit=id;name.value=x.name;desc.value=x.desc;cost.value=x.cost;rev.value=x.rev;status.value=x.status}function render(){let tc=0,trv=0;list.innerHTML='';items.forEach(x=>{tc+=x.cost;trv+=x.rev;list.innerHTML+=`<div class='project'><b>${x.name}</b><br>${x.desc}<br>Costs €${x.cost}<br>Revenue €${x.rev}<br>Profit €${x.rev-x.cost}<br><button onclick='editP(${x.id})'>Edit</button> <button onclick='del(${x.id})'>Delete</button></div>`});c.innerText=tc;r.innerText=trv;p.innerText=trv-tc}langSet('en');render();</script></body></html>
