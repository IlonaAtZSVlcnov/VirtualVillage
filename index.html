<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Village</title><style>body{font-family:Arial;margin:0;background:linear-gradient(#a6d8ff,#c9ffd1)}.header{background:#fff;padding:20px;display:flex;justify-content:space-between}.hero{background:#fff;margin:20px;padding:20px;border-radius:20px;display:flex;justify-content:space-between;flex-wrap:wrap}.stat{background:#f5f5f5;padding:10px 15px;border-radius:12px;margin:5px;display:inline-block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;padding:20px}.card,.project{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.card{cursor:pointer;text-align:center}.hidden{display:none}.error{border:2px solid red}.form input,.form textarea{width:100%;margin:6px 0;padding:8px}</style></head><body><div id=village><div class=header><h1 id=title>Virtual Village</h1><div><button onclick="setLang('en')">🇬🇧</button><button onclick="setLang('de')">🇩🇪</button></div></div><div class=hero><div><h2 id=cityNameDisplay>Green Valley</h2><button onclick="toggleCityEditor()">⚙ Edit City</button></div><div><span class=stat>👥 <span id=populationDisplay>2547</span></span><span class=stat>💰 <span id=budgetDisplay>125000</span></span><span class=stat>📈 <span id=developmentDisplay>92</span>%</span></div></div><div id=cityEditor class='hidden form hero'><input id=cityNameInput placeholder='City Name'><input id=populationInput type=number placeholder='Population'><input id=budgetInput type=number placeholder='Budget'><input id=developmentInput type=number placeholder='Development'><button onclick='saveCitySettings()'>Save City</button></div><div class=grid><div class=card>🏫 School</div><div class=card>📚 Library</div><div class=card>🔬 Laboratory</div><div class=card onclick='openTown()'>🏛️ Town Hall</div></div></div><div id=town class='hidden' style='padding:20px'><button onclick='closeTown()'>Back</button><h2>Project Organizer</h2><div class=form><input id=projectTitle placeholder='Project'><textarea id=projectDescription></textarea><input id=projectDate type=date><input id=projectCosts type=number placeholder='Costs'><input id=projectRevenue type=number placeholder='Revenue'><button onclick='saveProject()'>Save Project</button></div><div id=projects></div></div><script>let city=JSON.parse(localStorage.getItem('vv-city')||'{"name":"Green Valley","population":2547,"budget":125000,"development":92}');let projects=JSON.parse(localStorage.getItem('vv-projects')||'[]');function setLang(l){} function renderCity(){cityNameDisplay.innerText=city.name;populationDisplay.innerText=city.population;budgetDisplay.innerText=city.budget;developmentDisplay.innerText=city.development}function toggleCityEditor(){cityEditor.classList.toggle('hidden');cityNameInput.value=city.name;populationInput.value=city.population;budgetInput.value=city.budget;developmentInput.value=city.development}function clearErr(){document.querySelectorAll('.error').forEach(e=>e.classList.remove('error'))}function saveCitySettings(){clearErr();let n=cityNameInput.value.trim(),p=Number(populationInput.value),b=Number(budgetInput.value),d=Number(developmentInput.value);if(n.length<3){cityNameInput.classList.add('error');return alert('Invalid city name')}if(!Number.isInteger(p)||p<1){populationInput.classList.add('error');return alert('Invalid population')}if(b<0){budgetInput.classList.add('error');return alert('Invalid budget')}if(d<0||d>100){developmentInput.classList.add('error');return alert('Development 0-100')}city={name:n,population:p,budget:b,development:d};localStorage.setItem('vv-city',JSON.stringify(city));renderCity();cityEditor.classList.add('hidden')}function openTown(){village.classList.add('hidden');town.classList.remove('hidden');render()}function closeTown(){town.classList.add('hidden');village.classList.remove('hidden')}function saveProject(){clearErr();let t=projectTitle.value.trim();let dt=projectDate.value;let c=Number(projectCosts.value);let r=Number(projectRevenue.value);if(t.length<3){projectTitle.classList.add('error');return alert('Project name too short')}if(!dt){projectDate.classList.add('error');return alert('Date required')}if(c<0){projectCosts.classList.add('error');return alert('Costs invalid')}if(r<0||r>100000000){projectRevenue.classList.add('error');return alert('Revenue invalid')}projects.push({id:Date.now(),title:t,date:dt,costs:c,revenue:r});localStorage.setItem('vv-projects',JSON.stringify(projects));render()}function render(){projects.innerHTML='';(JSON.parse(localStorage.getItem("vv-projects")||'[]')).forEach(p=>{projects.innerHTML+=`<div class=project><b>${p.title}</b><br>${p.date}<br>Profit: €${p.revenue-p.costs}</div>`})}renderCity();render();</script></body></html>
